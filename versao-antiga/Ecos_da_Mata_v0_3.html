// Intenção anunciada pelo inimigo para o turno atual (determinística: o jogador pode planejar).
function enemyIntent(enemy) {
  const t = enemy.turn || 0;
  if (enemy.id === 'boss') {
    const p2 = enemy.hp <= enemy.maxHp / 2;
    if (t % 3 === 1) return { type: 'root', label: p2 ? 'Raízes famintas' : 'Ergue a couraça', description: `Ganha ${p2 ? 8 : 6} de couraça em vez de atacar.`, damage: 0, armor: p2 ? 8 : 6 };
    if (p2 && t % 3 === 2) return { type: 'heavy', label: 'Golpe de tronco', description: 'Uma pancada que passa por guardas pequenas.', damage: 8 };
    return { type: 'attack', label: 'Corte de raízes', description: 'Um golpe direto; a couraça dele ainda absorve o seu dano.', damage: p2 ? 5 : 4 };
  }
  if (enemy.id === 'rat') {
    return t % 3 === 2 ? { type: 'heavy', label: 'Investida de farpas', description: 'O rato prepara um ataque pesado.', damage: 5 }
                       : { type: 'attack', label: 'Mordida rápida', description: 'Um golpe pequeno e veloz.', damage: 3 };
  }
  if (enemy.id === 'deer') {
    return t % 3 === 0 ? { type: 'guard', label: 'Galhos em guarda', description: 'Cobre o corpo com galhos: ganha 5 de couraça.', damage: 0, armor: 5 }
                       : { type: 'heavy', label: 'Chifres ocos', description: 'Um ataque difícil de aguentar sem defesa.', damage: 5 };
  }
  if (enemy.id === 'swarm') {
    return t % 3 === 1 ? { type: 'hex', label: 'Luz que confunde', description: 'Ataca e deixa Bram Exposto (+2 no próximo golpe).', damage: 1, expose: true }
                       : { type: 'attack', label: 'Picadas luminosas', description: 'Três picadas de 2 de dano; Guarda absorve cada uma.', damage: 2, hits: 3 };
  }
  return t % 2 === 0 ? { type: 'heavy', label: 'Martelo de casca', description: 'Ataque pesado, com pouca sutileza.', damage: 6 }
                     : { type: 'attack', label: 'Punho de madeira', description: 'Golpe de força média.', damage: 4 };
}

// ---------- motor ----------
const hasRelic = (S, id) => S.relics.includes(id);
function countStatuses(e) { return ENEMY_STATUS_KEYS.reduce((n, k) => n + (e[k] > 0 ? 1 : 0), 0); }
function view(S) {
  const e = S.e;
  return { ehp: e.hp, ear: e.armor, bhp: S.hp, bg: S.guard, mark: e.mark, weak: e.weak, poison: e.poison, exposed: e.exposed, stun: e.stun, bexp: S.exposed, mom: S.mom };
}

// S = { hp,maxHp,guard,exposed,mom,emberArmed,emberUid,emberSpent,mothUsed,relics:[ids], e:{id,type,hp,maxHp,armor,mark,weak,poison,exposed,stun,stunResist,intent} }
function simulateRound(S0, cards) {
  const S = JSON.parse(JSON.stringify(S0));
  S.mom = 0;
  const steps = [], synergies = [];
  const kindsAll = new Set(cards.map(c => SOULS[c.templateId].kind));
  const sum = { dmg: 0, armorLost: 0, guard: 0, heal: 0, applied: {}, poisonTick: 0, hpBefore: S.e.hp };
  let unplayed = [];

  const emit = (step, ev) => { ev.v = view(S); step.events.push(ev); return ev; };

  function dealDamage(step, total, parts, o = {}) {
    if (total <= 0) return;
    const ab = Math.min(S.e.armor, total);
    S.e.armor -= ab;
    const loss = Math.min(S.e.hp, total - ab);
    S.e.hp -= loss;
    sum.dmg += loss; sum.armorLost += ab;
    emit(step, { t: 'dmg', amount: loss, absorbed: ab, total, parts, pure: Boolean(o.pure), heavy: step.kind === 'heavy', killed: S.e.hp <= 0 });
  }

  function playSoul(step, card, pos, scale, echoing) {
    const soul = SOULS[card.templateId];
    const sc = n => Math.ceil(n * scale);
    let guardOnce = false;
    const c = {
      pos, n: cards.length, first: pos === 0, last: pos === cards.length - 1,
      prev: pos > 0 ? SOULS[cards[pos - 1].templateId] : null, kinds: kindsAll, bramHp: S.hp,
      enemy: S.e,
      note(text) { emit(step, { t: 'note', text }); },
      syn(name, text) { const s = { name, text, pos }; synergies.push(s); emit(step, { t: 'syn', name, text }); },
      has: k => S.e[k] > 0,
      statusCount: () => countStatuses(S.e),
      consume(k) { if (S.e[k] > 0) { S.e[k] = 0; emit(step, { t: 'consume', key: k }); return true; } return false; },
      hit(n) {
        let dmg = sc(n); const parts = [];
        if (S.mom > 0) { dmg += S.mom; parts.push(['Ímpeto', S.mom]); }
        if (S.e.exposed > 0) { dmg += EXPOSED_BONUS; parts.push(['Exposto', EXPOSED_BONUS]); }
        if (hasRelic(S, 'silverClamp') && pos === 0 && !echoing) { dmg += 2; parts.push(['Grampo de Prata', 2]); }
        if (parts.length && dmg > 0) {
          const m = parts.find(p => p[0] === 'Ímpeto'), x = parts.find(p => p[0] === 'Exposto');
          if (m && S.momFrom) { const s = { name: 'Ímpeto', text: `${S.momFrom} aqueceu o golpe: +${m[1]} de dano.`, pos }; synergies.push(s); emit(step, { t: 'syn', name: s.name, text: s.text }); }
          if (x && S.expFrom) { const s = { name: 'Presa fácil', text: `${S.expFrom} deixou o alvo Exposto: +${x[1]} de dano.`, pos }; synergies.push(s); emit(step, { t: 'syn', name: s.name, text: s.text }); }
        }
        dealDamage(step, dmg, parts);
      },
      pure(n) { dealDamage(step, n, [], { pure: true }); },
      guard(n) {
        let g = sc(n);
        if (hasRelic(S, 'boneRing') && soul.kind === 'guard' && !guardOnce) { g += 1; guardOnce = true; }
        S.guard += g; sum.guard += g; emit(step, { t: 'guard', amount: g });
      },
      heal(n) { const h = Math.min(S.maxHp - S.hp, sc(n)); if (h > 0) { S.hp += h; sum.heal += h; emit(step, { t: 'heal', amount: h }); } },
      healOnce(n) { if (S.mothUsed) return false; const before = S.hp; S.mothUsed = true; const h = Math.min(S.maxHp - S.hp, sc(n)); if (h > 0) { S.hp += h; sum.heal += h; emit(step, { t: 'heal', amount: h }); } return S.hp > before; },
      momentum(n) { S.mom += sc(n); S.momFrom = soul.name; emit(step, { t: 'status', who: 'bram', key: 'mom', amount: sc(n) }); },
      selfExpose() { S.exposed = 1; emit(step, { t: 'status', who: 'bram', key: 'exposed', amount: 1 }); },
      breakArmor() { const a = S.e.armor; if (a <= 0) return false; S.e.armor = 0; sum.armorLost += a; emit(step, { t: 'armorBreak', amount: a }); return true; },
      armEmber() { S.emberArmed = true; S.emberUid = card.uid; emit(step, { t: 'note', text: 'A brasa fica acesa: Bram sobreviverá a um golpe fatal.' }); },
      apply(key, n = 1) {
        if (key === 'stun' && S.e.stunResist) { S.e.weak = Math.min(6, S.e.weak + 2); emit(step, { t: 'resist', key, amount: 2 }); return; }
        if (key === 'mark') S.e.mark = 1;
        else if (key === 'exposed') { S.e.exposed = 1; S.expFrom = soul.name; }
        else if (key === 'stun') S.e.stun = 1;
        else if (key === 'weak') S.e.weak = Math.min(6, S.e.weak + sc(n));
        else if (key === 'poison') S.e.poison += sc(n);
        sum.applied[key] = (sum.applied[key] || 0) + (key === 'weak' || key === 'poison' ? sc(n) : 1);
        emit(step, { t: 'status', who: 'enemy', key, amount: key === 'weak' || key === 'poison' ? sc(n) : 1 });
        if (key === 'mark' && hasRelic(S, 'owlEye')) { c.note('Olho de Coruja: 2 de dano direto.'); dealDamage(step, 2, [['Olho de Coruja', 2]], { pure: true }); }
      },
      echo(f) {
        if (echoing) return;
        if (!c.prev || c.prev.id === 'glassRaven') { c.note('Sem carta anterior: nenhum eco.'); return; }
        const s = { name: 'Eco', text: `O Corvo repete ${c.prev.name} com metade do poder.`, pos }; synergies.push(s); emit(step, { t: 'syn', name: s.name, text: s.text });
        const prevCard = cards[pos - 1];
        playSoul(step, prevCard, pos - 1 >= 0 ? pos : pos, f, true);
      }
    };
    // durante o eco, "primeira/última" e "anterior" refletem a carta ecoada
    if (echoing) { c.first = false; c.last = false; c.prev = pos > 1 ? SOULS[cards[pos - 2].templateId] : null; }
    soul.play(c);
  }

  // --- cartas do jogador, na ordem escolhida ---
  for (let i = 0; i < cards.length; i++) {
    if (S.e.hp <= 0) { unplayed = cards.slice(i); break; }
    const card = cards[i], soul = SOULS[card.templateId];
    const step = { pos: i, card, kind: soul.kind, events: [] };
    emit(step, { t: 'play', name: soul.name });
    playSoul(step, card, i, 1, false);
    // relíquias de fechamento
    if (i === cards.length - 1 && cards.length === 3) {
      if (hasRelic(S, 'sap') || hasRelic(S, 'blackSap')) {
        if (S.e.hp > 0) { const ab = Math.min(S.e.armor, 3); S.e.armor -= ab; const l = Math.min(S.e.hp, 3 - ab); S.e.hp -= l; sum.dmg += l; sum.armorLost += ab; emit(step, { t: 'dmg', amount: l, absorbed: ab, total: 3, parts: [['Seiva Negra', 3]], pure: false, killed: S.e.hp <= 0 }); }
        S.exposed = 1; emit(step, { t: 'status', who: 'bram', key: 'exposed', amount: 1 });
      }
      if (hasRelic(S, 'carvedDie') && kindsAll.size === 3) { S.guard += 4; sum.guard += 4; emit(step, { t: 'guard', amount: 4 }); emit(step, { t: 'syn', name: 'Dado Entalhado', text: 'Três tipos diferentes: Guarda +4.' }); synergies.push({ name: 'Dado Entalhado', text: 'Três tipos diferentes: Guarda +4.', pos: i }); }
    }
    steps.push(step);
  }

  const playedCards = cards.slice(0, steps.length);
  const out = { steps, synergies, summary: sum, played: playedCards, unplayed, enemyPhase: { events: [] }, killedByCombo: S.e.hp <= 0 };
  sum.guardAfterCombo = S.guard;
  sum.enemyHpAfterCombo = S.e.hp;
  sum.incoming = { raw: 0, weakCut: 0, exposedBonus: 0, absorbed: 0, taken: 0, hits: 0, stunned: false, armorGain: 0 };

  // --- fase do inimigo ---
  const ph = out.enemyPhase; ph.events = [];
  const pe = ev => { ev.v = view(S); ph.events.push(ev); };
  if (S.e.hp > 0) {
    if (S.e.poison > 0) {
      const d = Math.min(S.e.hp, S.e.poison);
      S.e.hp -= d; sum.poisonTick = d; sum.dmg += d;
      pe({ t: 'poison', amount: d, killed: S.e.hp <= 0 });
      S.e.poison = Math.max(0, S.e.poison - 1);
    }
  }
  out.killedByPoison = S.e.hp <= 0 && !out.killedByCombo;
  if (S.e.hp > 0) {
    const it = S.e.intent;
    if (S.e.stun > 0) {
      S.e.stun = 0; sum.incoming.stunned = true; pe({ t: 'stunned', label: it.label });
    } else if (it.armor) {
      S.e.armor += it.armor; sum.incoming.armorGain = it.armor; pe({ t: 'enemyArmor', amount: it.armor, label: it.label });
    } else if (it.damage > 0) {
      const hits = it.hits || 1; let weak = S.e.weak, exp = S.exposed, lossTotal = 0; const hl = [];
      for (let h = 0; h < hits; h++) {
        let raw = it.damage; const cut = Math.min(weak, raw); raw -= cut; weak -= cut; sum.incoming.weakCut += cut;
        sum.incoming.raw += it.damage;
        let bonus = 0; if (exp > 0 && raw > 0) { bonus = EXPOSED_BONUS; exp = 0; sum.incoming.exposedBonus += bonus; }
        const dmg = raw + bonus; const ab = Math.min(S.guard, dmg); S.guard -= ab; sum.incoming.absorbed += ab;
        const taken = dmg - ab; lossTotal += taken; hl.push({ raw: it.damage, cut, bonus, absorbed: ab, taken });
      }
      S.e.weak = weak; S.exposed = exp;
      let hpLoss = lossTotal, saved = false;
      if (S.hp - hpLoss <= 0 && S.emberArmed) { hpLoss = S.hp - 1; saved = true; S.emberSpent = true; }
      S.hp -= hpLoss; sum.incoming.taken = hpLoss; sum.incoming.hits = hits;
      pe({ t: 'enemyHit', hits: hl, taken: hpLoss, label: it.label, ember: saved, heavy: it.type === 'heavy' });
      if (it.expose) { S.exposed = 1; pe({ t: 'status', who: 'bram', key: 'exposed', amount: 1 }); }
    } else { pe({ t: 'note', text: `${it.label}.` }); }
  }
  S.emberArmed = S.emberSpent ? false : S.emberArmed;
  S.guard = 0; S.e.exposed = 0;
  out.final = S;
  out.killsEnemy = S.e.hp <= 0; out.killsBram = S.hp <= 0;
  sum.enemyHpAfter = S.e.hp; sum.bramHpAfter = S.hp;
  sum.perStep = steps.map(st => ({ dmg: st.events.filter(e => e.t === 'dmg').reduce((a, e) => a + e.amount + e.absorbed, 0), guard: st.events.filter(e => e.t === 'guard').reduce((a, e) => a + e.amount, 0) }));
  return out;
}

function randInt(max) { return Math.floor(Math.random() * max); }

function shuffle(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = randInt(i + 1); [out[i], out[j]] = [out[j], out[i]]; }

function escapeHtml(value) {

function generateMap() {
  const rows = [
    [{ id:'start', layer:0, x:500, y:752, type:'start' }],
    shuffle(['combat','event','camp']).map((type, i) => ({ id:`r1_${i}`, layer:1, x:[220,500,780][i], y:622, type })),
    shuffle(['elite','shop','npc','treasure']).map((type, i) => ({ id:`r2_${i}`, layer:2, x:[145,380,620,855][i], y:465, type })),
    shuffle(['combat','camp','event']).map((type, i) => ({ id:`r3_${i}`, layer:3, x:[285,500,715][i], y:310, type })),
    [{ id:'boss', layer:4, x:500, y:135, type:'boss' }]
  ];
  const all = rows.flat().map(n => ({ ...n, edges:[], visited:false, resolved:false, data:null }));
  const byId = Object.fromEntries(all.map(n => [n.id,n]));
  byId.start.edges = rows[1].map(n => n.id);
  rows[1].forEach((n, i) => { byId[n.id].edges = [rows[2][i].id, rows[2][i+1].id]; });
  rows[2].forEach((n, i) => {
    if (i === 0) byId[n.id].edges = [rows[3][0].id];
    else if (i === 1) byId[n.id].edges = [rows[3][0].id, rows[3][1].id];
    else if (i === 2) byId[n.id].edges = [rows[3][1].id, rows[3][2].id];
    else byId[n.id].edges = [rows[3][2].id];
  });
  rows[3].forEach(n => { byId[n.id].edges = ['boss']; });
  byId.start.visited = true;
  byId.start.resolved = true;
  return all;
}

function normalizeBattle() {

  if (!Array.isArray(battle.slots)) battle.slots = Array(COMBO_SLOTS).fill(null);

      battle.drawPile = shuffle(battle.discardPile.splice(0));

function commitRound(res) {

// Redesenha só as regiões dinâmicas (mão, espaços, prévia, barras). Mantém o resto da arena intacto.

// ---------- manipulação das almas: arrastar, soltar, trocar, devolver, cliques e teclado ----------
function repaint() { paint(); saveSnapshot(); }
// Move uma alma para um destino. Nunca remove nem duplica: os espaços só guardam referências a cartas da mão.

  const s = battle.slots, from = s.indexOf(uid);
  if (target.type === 'hand') { if (from < 0) return false; s[from] = null; }
  else {

    else s[i] = uid;                                // a alma que estava no espaço volta sozinha para a mão

function clearOver() { $$('.cb .over').forEach(e => e.classList.remove('over', 'swap')); }

app.addEventListener('pointerdown', e => {
  if (cbBusy || screen !== 'combat' || !battle || drag) return;

  inspectUid = uid; inspect(uid);

// teclado: Enter/Espaço move; setas reordenam dentro da combinação; Delete/Backspace devolve; 1-3 escolhem o espaço
app.addEventListener('keydown', e => {
  if (cbBusy || screen !== 'combat' || !battle) return;
  const el = e.target.closest && e.target.closest('.soul[data-uid]'); if (!el) return;
  const uid = el.dataset.uid, from = battle.slots.indexOf(uid);
  let handled = true;
  if (e.key === 'Enter' || e.key === ' ') clickCard(uid);
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && from >= 0) { const to = from + (e.key === 'ArrowRight' ? 1 : -1); if (to >= 0 && to < COMBO_SLOTS) { moveCard(uid, { type: 'slot', i: to }); repaint(); } }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && from >= 0) { moveCard(uid, { type: 'hand' }); repaint(); }

const rect = sel => F.rectOf(sel) || { x: innerWidth / 2, y: innerHeight / 2, w: 100, h: 100 };

  mark() { F.chip([988, 1318], { step: .06 }); },
  weak() { F.chip([440, 330, 247], { type: 'triangle', step: .07 }); },
  poison() { F.chip([300, 260, 300, 240], { type: 'sawtooth', step: .05, vol: .05 }); },
  stun() { F.chip([880, 660, 880, 440], { type: 'triangle', step: .09 }); },
  guard() { playSfx('guard'); F.chip([330, 440], { type: 'triangle', step: .06 }); },
  heal() { F.chip([392, 523, 659, 784], { step: .07 }); },
  syn() { F.chip([523, 659, 784, 1047], { step: .06, vol: .09 }); },
  brk() { playSfx('hit'); F.chip([160, 120, 90], { type: 'square', step: .06 }); },
  mom() { F.chip([440, 554, 659], { step: .05 }); },
  hurt() { playSfx('hurt'); }
};
function classPulse(el, cls, ms) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
async function fly(el, to) {
  if (!el || F.reduced() || !el.animate) return;
  const r = el.getBoundingClientRect(), g = el.cloneNode(true);
  g.classList.add('ghost', 'flying'); g.removeAttribute('tabindex'); g.removeAttribute('data-uid');
  g.style.cssText += `;position:fixed;left:0;top:0;width:${r.width}px;height:${r.height}px;margin:0;z-index:8000;pointer-events:none;`;
  document.body.appendChild(g);
  const a = g.animate([{ transform: `translate(${r.left}px,${r.top}px) scale(1) rotate(0deg)`, opacity: 1 }, { transform: `translate(${to.x - r.width / 2}px,${to.y - r.height / 2}px) scale(.4) rotate(16deg)`, opacity: .15 }],
    { duration: fast ? 120 : 300, easing: 'cubic-bezier(.45,0,.8,.45)', fill: 'forwards' });
  try { await a.finished; } catch (e) { /* cancelado */ }
  g.remove();
}
function fmtParts(parts) { return parts && parts.length ? ' (' + parts.map(p => `+${p[1]} ${p[0]}`).join(', ') + ')' : ''; }

function showEvent(ev, step) {
  const ep = enemyPos(), bp = bramPos();
  switch (ev.t) {
    case 'play': feed(`${NUM[step.pos]} <b>${esc(ev.name)}</b>`, 'ln-card'); break;
    case 'dmg': {
      const big = ev.heavy || ev.total >= 8;
      if (!ev.pure) { F.slash(ep.x, ep.y, big ? '#ffd27a' : '#fff'); if (big) F.slash(ep.x, ep.y, '#ff9a3c', true); }
      F.burst(ep.x, ep.y, { n: 10 + Math.min(ev.total, 14) * 3, colors: ev.pure ? ['#b58a2a', '#ffd27a', '#fff'] : ['#ffd27a', '#ff9a3c', '#fff', '#ff5a3a'], speed: 70 + Math.min(ev.total, 14) * 9 });
      F.impact(ep.x, ep.y, big ? 5 : 3);
      if (big) F.ring(ep.x, ep.y, '#ffd27a', 46);
      if (ev.amount > 0) F.floatText('-' + ev.amount, ep.x + rnd(-18, 18), ep.y - 30, 't-dmg' + (ev.total >= 10 ? ' t-crit' : ''));
      if (ev.absorbed > 0) F.floatText('▣ -' + ev.absorbed, ep.x + 46, ep.y + 8, 't-guard');
      classPulse($('.creature-portrait'), 'hit', 420);
      F.shake(big ? 2 : 1); if (ev.total >= 10) F.flash('#fff3c0', .25);
      S.hit(big);
      feed(`⚔ ${ev.total} de dano${fmtParts(ev.parts)}${ev.absorbed ? ` — ${ev.absorbed} absorvido pela couraça` : ''}`, 'ln-dmg');
      break;
    }
    case 'guard': F.floatText('+' + ev.amount + ' GUARDA', bp.x, bp.y - 50, 't-guard'); F.burst(bp.x, bp.y, { n: 14, colors: ['#6fb4d9', '#cfe8f5'], speed: 70, g: 0 }); F.ring(bp.x, bp.y, '#6fb4d9', 40); classPulse($('.cb-hero'), 'shield', 500); S.guard(); feed(`▣ Guarda +${ev.amount}`, 'ln-guard'); break;
    case 'heal': F.floatText('+' + ev.amount, bp.x, bp.y - 50, 't-heal'); F.burst(bp.x, bp.y, { n: 22, colors: ['#8fd16a', '#d8f59a', '#fff'], speed: 60, g: -40, life: 1 }); S.heal(); feed(`♥ Bram recupera ${ev.amount} de vida`, 'ln-heal'); break;
    case 'status':
      if (ev.who === 'enemy') {
        const info = STATUS_INFO[ev.key];
        F.floatText(info.icon + ' ' + info.name.toUpperCase() + (ev.amount > 1 ? ' ' + ev.amount : ''), ep.x, ep.y - 62, 't-status st-' + ev.key);
        F.burst(ep.x, ep.y, { n: 12, colors: ev.key === 'poison' ? ['#8fd16a', '#4f8a3a'] : ev.key === 'mark' ? ['#ffd27a', '#b58a2a'] : ['#c9a6ff', '#7a5aa8'], speed: 50, g: -20 });
        (ev.key === 'mark' ? S.mark : ev.key === 'weak' ? S.weak : ev.key === 'poison' ? S.poison : ev.key === 'stun' ? S.stun : S.mark)();
        feed(`${info.icon} ${info.name}${ev.amount > 1 ? ' ' + ev.amount : ''} no inimigo`, 'ln-st');
      } else if (ev.key === 'mom') { F.floatText('» ÍMPETO +' + ev.amount, bp.x, bp.y - 50, 't-amber'); S.mom(); feed(`» Ímpeto +${ev.amount}: os próximos golpes ficam mais fortes`, 'ln-st'); }
      else { F.floatText('⚠ EXPOSTO', bp.x, bp.y - 50, 't-hurt'); feed('⚠ Bram fica Exposto: o próximo golpe recebido causa +' + EXPOSED_BONUS, 'ln-warn'); }
      break;
    case 'resist': F.floatText('RESISTE', ep.x, ep.y - 62, 't-guard'); feed('O inimigo resiste ao atordoamento e fica com Fraqueza 2.', 'ln-st'); break;
    case 'consume': F.floatText(STATUS_INFO[ev.key].name + ' usada', ep.x, ep.y - 40, 't-amber'); feed(`${STATUS_INFO[ev.key].icon} ${STATUS_INFO[ev.key].name} consumida`, 'ln-st'); break;
    case 'armorBreak': F.ring(ep.x, ep.y, '#6fb4d9', 70); F.sparks(ep.x, ep.y, 24, ['#6fb4d9', '#cfe8f5', '#fff']); F.floatText('COURAÇA QUEBRADA', ep.x, ep.y - 50, 't-guard'); F.shake(2); S.brk(); feed(`▣ Couraça destruída (${ev.amount})`, 'ln-st'); break;
    case 'syn':
      F.banner(ev.name.toUpperCase() + '!', 5); F.flash('#ffd27a', .18); S.syn();
      feed(`✦ <b>${esc(ev.name)}</b> — ${esc(ev.text)}`, 'ln-syn'); break;
    case 'note': feed(esc(ev.text), 'ln-note'); break;
  }
  if (ev.v) applyViewBusy(ev.v);
}
// durante a animação, a visão usa os valores da simulação evento a evento
function applyViewBusy(v) { const w = { ...v }; applyView(w, null); const pv = $('#cb-armor'); if (pv) pv.textContent = v.ear > 0 ? `▣ Couraça ${v.ear}` : ''; }

async function playStep(step, slotEl) {
  const card = slotEl && $('.soul', slotEl);
  classPulse(card, 'casting', 600);
  playSfx('card');
  await wait(260);
  const first = step.events.find(e => e.t === 'dmg' && !e.pure);
  const toEnemy = Boolean(first) || step.events.some(e => e.t === 'status' && e.who === 'enemy');
  await fly(card, toEnemy ? enemyPos() : bramPos());
  if (card) card.classList.add('spent');
  for (const ev of step.events) {
    showEvent(ev, step);
    await wait(ev.t === 'syn' ? 420 : ev.t === 'dmg' ? 300 : ev.t === 'play' || ev.t === 'note' ? 60 : 220);
  }
  await wait(180);
}

async function playEnemyPhase(res) {
  const evs = res.enemyPhase.events, e = battle.enemy;
  if (!evs.length) return;
  await wait(220);
  for (const ev of evs) {
    const ep = enemyPos(), bp = bramPos();
    if (ev.t === 'poison') {
      F.floatText('☣ -' + ev.amount, ep.x, ep.y - 30, 't-heal'); F.burst(ep.x, ep.y, { n: 18, colors: ['#8fd16a', '#4f8a3a', '#d8f59a'], speed: 50, g: -30 }); classPulse($('.creature-portrait'), 'hit', 420); S.poison();
      feed(`☣ O veneno corrói o inimigo: -${ev.amount} (ignora couraça)`, 'ln-st'); applyViewBusy(ev.v); await wait(520);
    } else if (ev.t === 'stunned') {
      F.floatText('✦ ATORDOADO!', ep.x, ep.y - 56, 't-status st-stun'); F.ring(ep.x, ep.y, '#c9a6ff', 60); S.stun(); classPulse($('#cb-intent'), 'canceled', 900);
      feed(`✦ ${esc(ev.label)} foi cancelado: o inimigo perde a ação`, 'ln-syn'); applyViewBusy(ev.v); await wait(760);
    } else if (ev.t === 'enemyArmor') {
      classPulse($('.creature-portrait'), 'shield', 520); F.floatText('COURAÇA +' + ev.amount, ep.x, ep.y - 50, 't-guard'); F.burst(ep.x, ep.y, { n: 16, colors: ['#6fb4d9', '#cfe8f5'], speed: 80, g: 0 }); playSfx('guard');
      feed(`▣ ${esc(ev.label)}: o inimigo ganha ${ev.amount} de couraça`, 'ln-warn'); applyViewBusy(ev.v); await wait(620);
    } else if (ev.t === 'enemyHit') {
      classPulse($('.creature-portrait'), 'lunge', 400); feed(`${esc(ev.label)}…`, 'ln-warn'); await wait(300);
      let left = ev.taken, cum = 0;
      for (const h of ev.hits) {
        const dmgThrough = h.taken;
        if (h.cut > 0) F.floatText('FRACO −' + h.cut, ep.x, ep.y - 20, 't-status st-weak');
        if (dmgThrough > 0) {
          cum += dmgThrough;
          F.shake(ev.heavy || dmgThrough >= 4 ? 3 : 2); F.flash('#d9473a', .4);
          F.floatText('-' + dmgThrough, bp.x, bp.y - 20, 't-hurt'); F.burst(bp.x, bp.y, { n: 18, colors: ['#d9473a', '#ff8a6a', '#fff'], speed: 110 }); F.sparks(bp.x, bp.y, 14, ['#ff8a6a', '#ffd27a', '#fff']);
          classPulse($('.cb-hero'), 'hurt', 450); S.hurt();
          applyViewBusy({ ...ev.v, bhp: ev.v.bhp + (ev.taken - cum) });
        } else if (h.absorbed > 0) { F.floatText('BLOQUEADO', bp.x, bp.y - 20, 't-guard'); F.burst(bp.x, bp.y, { n: 10, colors: ['#6fb4d9', '#cfe8f5'], speed: 80 }); S.guard(); }
        else F.floatText('0', bp.x, bp.y - 20, 't-guard');
        await wait(ev.hits.length > 1 ? 260 : 120);
      }
      const t = ev.hits.reduce((a, h) => a + h.taken, 0);
      feed(t > 0 ? `Bram recebe ${t} de dano${ev.hits.some(h => h.absorbed) ? ` (${ev.hits.reduce((a, h) => a + h.absorbed, 0)} absorvido)` : ''}.` : 'Bram bloqueia o golpe.', t > 0 ? 'ln-dmg' : 'ln-guard');
      if (ev.ember) { F.banner('A ÚLTIMA BRASA!', 6); F.flash('#ff9a3c', .5); F.chip([262, 330, 392, 523], { step: .1 }); feed('🔥 A Última Brasa segura Bram com 1 de vida e se apaga para sempre.', 'ln-syn'); }
      applyViewBusy(ev.v); await wait(360);
    } else if (ev.t === 'status') {
      F.floatText('⚠ EXPOSTO', bp.x, bp.y - 40, 't-hurt'); feed('⚠ Bram fica Exposto: o próximo golpe recebido causa +' + EXPOSED_BONUS, 'ln-warn'); applyViewBusy(ev.v); await wait(300);
    } else if (ev.t === 'note') { feed(esc(ev.text), 'ln-note'); await wait(300); }
  }
}

function deathFx() {
  const ep = enemyPos(); const p = $('.creature-portrait'); if (p) p.classList.add('dying');
  F.burst(ep.x, ep.y, { n: 70, colors: ['#ffd27a', '#ff9a3c', '#fff', '#d9473a', '#8fd16a'], speed: 220, g: 120, life: 1.1 });
  F.ring(ep.x, ep.y, '#fff', 90); setTimeout(() => F.ring(ep.x, ep.y, '#ff9a3c', 120), 180); F.impact(ep.x, ep.y, 9);
  F.shake(3); F.flash('#ffffff', .6); F.glitch(); playSfx('hit'); F.chip([523, 392, 262, 196], { type: 'sawtooth', step: .08, vol: .08 });
}

async function executeCombo() {
  if (cbBusy || !battle || screen !== 'combat') return;
  const cards = comboSequence();
  if (!cards.length) { showToast('Coloque ao menos uma alma na combinação.'); return; }
  cancelDrag();
  cbBusy = true; fast = false; feedLines = [];
  document.body.classList.add('cb-busy');
  const res = previewCombo(cards);
  const slotEls = battle.slots.map((uid, i) => uid ? $(`.cb-slot[data-slot="${i}"]`) : null).filter(Boolean);
  try {
    const ex = $('#cb-exec'); if (ex) { ex.disabled = true; ex.textContent = 'Executando…'; }
    const pv = $('#cb-pv'); if (pv) pv.innerHTML = '<div class="pv-feed live"><b>Executando…</b></div>';
    $$('.cb-slot .cb-step').forEach(e => e.remove());
    const pr = $('#cb-ehp .pred'); if (pr) pr.style.width = '0';
    for (let i = 0; i < res.steps.length; i++) await playStep(res.steps[i], slotEls[i]);
    if (res.unplayed.length) feed(`O inimigo caiu antes de ${res.unplayed.length} alma(s) agirem: elas voltam para a mão.`, 'ln-note');
    if (res.killsEnemy) {
      if (res.killedByPoison) { await playEnemyPhase(res); }
      await wait(200); deathFx(); await wait(1000);
    } else {
      await playEnemyPhase(res);
      if (res.killsBram) {
        $('.cb-hero') && $('.cb-hero').classList.add('dying');
        F.glitch(); F.flash('#d9473a', .6); F.chip([392, 330, 262, 196, 131], { type: 'sawtooth', step: .14, vol: .08 });
        feed('Bram cai. A mata cobre seus passos…', 'ln-dmg'); await wait(1300);
      }
    }
    commitRound(res);
    battle.feed = feedLines.slice(-8);
    if (res.killsEnemy) {
      const amb0 = run.amber;
      winBattle(res.played);
      if (screen === 'reward') F.floatText('+' + (run.amber - amb0) + ' ÂMBAR', innerWidth / 2, innerHeight * .3, 't-amber');
      if (screen === 'victory') for (let i = 0; i < 6; i++) setTimeout(() => F.burst(rnd(innerWidth * .2, innerWidth * .8), rnd(80, 260), { n: 40, colors: ['#ffd27a', '#8fd16a', '#fff', '#ff9a3c'], speed: 160, g: 120, life: 1.2 }), i * 180);
    } else if (res.killsBram) {
      endRun(false);
    } else {
      advanceTurn();
      if (battle.reshuffled) { battle.feed.push('<span class="ln-note">♻ O descarte foi embaralhado para formar uma nova pilha de compra.</span>'); F.chip([330, 392, 330, 392, 440], { type: 'triangle', step: .05, vol: .06 }); }
    }
  } catch (err) {
    console.error('Falha na execução da combinação', err);
    if (battle) { try { normalizeBattle(); } catch (e) {} }
  } finally {
    cbBusy = false; document.body.classList.remove('cb-busy');
    if (screen === 'combat') render();
  }
}

// ---------- ligações com o resto do jogo ----------
let knownFor = null, known = new Set();
const _render = window.render;
window.render = function () {
  if (cbBusy && screen === 'combat') return;      // nunca redesenha a arena no meio da animação
  _render();
  document.body.classList.toggle('in-combat', screen === 'combat');
  if (screen === 'combat' && battle) {
    if (knownFor !== battle) { knownFor = battle; known = new Set(); inspectUid = null; feedLines = []; }
    battle.hand.forEach(c => { if (!known.has(c.uid)) { fresh.add(c.uid); known.add(c.uid); } });
    paint();
    if (battle.reshuffled) { classPulse($('#cb-draw'), 'shuffle', 700); }
  }
};
app.addEventListener('click', e => { if (cbBusy) { e.stopPropagation(); e.preventDefault(); fast = true; } }, true);
app.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  if (t.dataset.action === 'cb-exec') executeCombo();
  else if (t.dataset.action === 'cb-clear' && battle && !cbBusy) { battle.slots = Array(COMBO_SLOTS).fill(null); playSfx('select'); repaint(); }
});
window.addEventListener('resize', () => { if (drag && drag.started) cancelDrag(); });
// gancho para testes automatizados
window.__cb = { moveCard, paint, executeCombo, cancelDrag, isBusy: () => cbBusy, repaint, previewCombo };
})();
</script>
